<!doctype html>
<html lang="it" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impostazioni assistente</title>
<style>
  :root { --sfondo: #f6f1e9; --carta: #fff; --testo: #1d1a16; --tenue: #6b6258; --oro: #d9a441; --verde: #2f9e5b; --rosso: #c63b2f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo); font-family: "Segoe UI", Arial, sans-serif; padding: 24px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  p.sotto { color: var(--tenue); margin: 0 0 20px; }
  form { background: var(--carta); border-radius: 18px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  small { display: block; color: var(--tenue); font-weight: 400; margin-top: 2px; }
  input { width: 100%; font-size: 17px; padding: 11px 12px; border: 1px solid #d8d0c4; border-radius: 10px; background: #fffdf9; }
  button { margin-top: 22px; width: 100%; font-size: 19px; font-weight: 700; padding: 14px; border: 0; border-radius: 12px; background: var(--oro); color: #1d1a16; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #esiti { margin-top: 18px; }
  .esito { padding: 10px 14px; border-radius: 10px; margin-top: 8px; }
  .ok { background: #e3f4ea; color: #1d5e37; }
  .no { background: #fbe5e2; color: #7d241b; }
  a { color: var(--testo); }
</style>
</head>
<body>
<main>
  <h1>⚙️ Impostazioni</h1>
  <p class="sotto">Da compilare una volta sola. Poi l'assistente si apre da solo all'accensione.</p>
  <form id="modulo">
    <label>Nome della mamma <small>Lo usa per firmare le email e per salutarla.</small></label>
    <input name="nome" autocomplete="off" placeholder="Es. Maria Rossi">
    <label>Nome dell'assistente <small>La parola per chiamarlo: "Ehi …". Lascia vuoto per usare quello dello stile (Aurora o RoboGiuliano).</small></label>
    <input name="nomeAssistente" autocomplete="off" placeholder="Aurora / RoboGiuliano">
    <label>Stile</label>
    <select name="tema" style="width:100%;font-size:17px;padding:11px 12px;border:1px solid #d8d0c4;border-radius:10px;background:#fffdf9">
      <option value="allegra">Aurora (faccina colorata)</option>
      <option value="robo">RoboGiuliano (avatar robot)</option>
    </select>
    <label>Voce</label>
    <select name="voce" style="width:100%;font-size:17px;padding:11px 12px;border:1px solid #d8d0c4;border-radius:10px;background:#fffdf9">
      <option value="auto">Automatica (femminile per Aurora, maschile per RoboGiuliano)</option>
      <option value="femminile">Femminile</option>
      <option value="maschile">Maschile</option>
    </select>
    <label>Email Yahoo</label>
    <input name="email" type="email" autocomplete="off" placeholder="nome@yahoo.it" required>
    <label>Password per app di Yahoo <small>Quella da 16 lettere (Yahoo → Sicurezza account → Genera password per app). Non la password normale.</small></label>
    <input name="password" type="password" autocomplete="off" placeholder="xxxx xxxx xxxx xxxx">
    <label>Chiave API di Claude <small>Da console.anthropic.com → API keys. Inizia con sk-ant-…</small></label>
    <input name="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…">
    <label>Email del figlio <small>Dove arrivano le richieste di aiuto.</small></label>
    <input name="emailFiglio" type="email" autocomplete="off" placeholder="tuo.indirizzo@gmail.com">
    <label style="display:flex;gap:10px;align-items:center;font-weight:600;margin-top:18px"><input name="avvioAutomatico" type="checkbox" checked style="width:22px;height:22px">Apri da solo all'accensione di questo computer</label>
    <small>Toglila se lo stai solo provando sul tuo computer.</small>
    <button id="salva">Salva e prova</button>
    <div id="esiti"></div>
  </form>
  <p class="sotto" style="margin-top:16px"><a href="/">← Torna all'assistente</a></p>
</main>
<script>
  const f = document.getElementById("modulo");
  fetch("/config").then((r) => r.json()).then((c) => {
    f.nome.value = c.nome; f.tema.value = c.tema || "allegra"; f.voce.value = c.voce || "auto"; f.nomeAssistente.value = c.nomeAssistente; f.avvioAutomatico.checked = c.avvioAutomatico; f.email.value = c.email; f.emailFiglio.value = c.emailFiglio;
    if (c.haPassword) f.password.placeholder = "già salvata (lascia vuoto per non cambiarla)";
    if (c.haChiave) f.apiKey.placeholder = "già salvata (lascia vuoto per non cambiarla)";
  });
  f.onsubmit = async (e) => {
    e.preventDefault();
    const b = document.getElementById("salva"), out = document.getElementById("esiti");
    b.disabled = true; b.textContent = "Provo il collegamento…"; out.innerHTML = "";
    try {
      const dati = Object.fromEntries(new FormData(f));
      const r = await fetch("/salva", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dati) });
      const { esiti } = await r.json();
      for (const x of esiti) {
        const d = document.createElement("div");
        d.className = "esito " + (x.ok ? "ok" : "no");
        d.textContent = (x.ok ? "✓ " : "✕ ") + x.testo;
        out.appendChild(d);
      }
      if (esiti.every((x) => x.ok)) {
        const a = document.createElement("div");
        a.className = "esito ok";
        a.innerHTML = 'Tutto pronto! <a href="/">Apri l\'assistente</a> e consenti il microfono quando lo chiede.';
        out.appendChild(a);
      }
    } catch (err) {
      out.innerHTML = '<div class="esito no">✕ Errore: ' + err.message + "</div>";
    }
    b.disabled = false; b.textContent = "Salva e prova";
  };
</script>
</body>
</html>

<!doctype html>
<html lang="it" translate="no" data-tema="allegra">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ehi Aurora</title>
<link rel="icon" href="/icona.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI Variable Display", "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; text-align: center; user-select: none; overflow: hidden; position: relative; }
  #cerchio { position: relative; width: 260px; height: 260px; border-radius: 50%; border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; transition: background .3s, transform .3s, box-shadow .4s; }
  #cerchio:active { transform: scale(.96); }
  .strato { position: absolute; pointer-events: none; display: none; }
  .icona { position: relative; font-size: 110px; line-height: 1; }
  #stato { font-size: 44px; font-weight: 700; }
  #aiuto { font-size: 28px; }
  #detto { font-size: 26px; font-style: italic; min-height: 1.4em; max-width: 900px; }
  /* Risposta grande e leggibile: scritta bianca su un riquadro scuro, max-height con scorrimento per quelle lunghe */
  #risposta { font-size: 34px; font-weight: 500; line-height: 1.5; max-width: 1100px; min-height: 1.4em; max-height: 38vh; overflow-y: auto; scrollbar-width: none; }
  #risposta:not(:empty) { color: #fff; }
  /* Sottotitoli a karaoke: le parole già dette si accendono, quella che sta dicendo è gialla */
  #risposta .p { transition: opacity .25s, color .25s; opacity: .38; }
  #risposta .p.detta { opacity: 1; }
  #risposta .p.ora { opacity: 1; color: #ffe27a; }
  /* Cosa sta facendo davvero (posta, stampante, internet…) */
  #azione { display: none; align-items: center; gap: 10px; margin-top: -14px; padding: 8px 20px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); font-size: 22px; font-weight: 600; }
  #azione.si { display: inline-flex; }
  #azione::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: puntini 1.2s steps(4) infinite; }
  @keyframes puntini { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  #avvia { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 24px; font-size: 40px; font-weight: 700; cursor: pointer; z-index: 5; }
  #avvia span { font-size: 120px; }
  #impostazioni { position: fixed; bottom: 12px; right: 16px; font-size: 15px; opacity: .5; color: inherit; }
  body > * { position: relative; z-index: 1; }
  @keyframes ruota { to { transform: rotate(360deg); } }
  @keyframes respira { 50% { transform: scale(1.07); } }
  @keyframes gira { 50% { transform: scale(.94); } }

  @keyframes deriva { to { transform: translate(18vmax, 10vmax) scale(1.15); } }
  @keyframes forma { 0%,100% { border-radius: 42% 58% 60% 40% / 45% 45% 55% 55%; } 33% { border-radius: 60% 40% 35% 65% / 55% 60% 40% 45%; } 66% { border-radius: 38% 62% 55% 45% / 60% 35% 65% 40%; } }
  /* ---------- D · Aurora allegra (con faccina) ---------- */
  .faccia, #bolle { display: none; }
  [data-tema="allegra"] body { background: #140b33; color: #fff8fd; }
  [data-tema="allegra"] body::before, [data-tema="allegra"] body::after { content: ""; position: fixed; width: 65vmax; height: 65vmax; border-radius: 50%; filter: blur(90px); opacity: .6; z-index: 0; animation: deriva 16s ease-in-out infinite alternate; }
  [data-tema="allegra"] body::before { background: #8b3dff; top: -30vmax; left: -22vmax; }
  [data-tema="allegra"] body::after { background: #ff5fa2; bottom: -36vmax; right: -22vmax; animation-delay: -8s; }
  [data-tema="allegra"] #bolle { display: block; position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  [data-tema="allegra"] #bolle span { position: absolute; bottom: -60px; border-radius: 50%; opacity: .7;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), var(--c) 45%, transparent 72%); animation: sale var(--t) linear infinite; animation-delay: var(--d); }
  @keyframes sale { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 10% { opacity: .75; } 50% { transform: translate(var(--x), -55vh) scale(1); } 100% { transform: translate(0, -115vh) scale(.8); opacity: 0; } }
  [data-tema="allegra"] .icona { display: none; }
  [data-tema="allegra"] #cerchio { width: 300px; height: 300px; background: rgba(255,255,255,.08); backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3); animation: galleggia 3.4s ease-in-out infinite; }
  @keyframes galleggia { 50% { transform: translateY(-12px) rotate(-2deg); } }
  [data-tema="allegra"] #cerchio:active { animation: schiaccia .35s ease-out; }
  @keyframes schiaccia { 40% { transform: scale(1.12, .86); } 70% { transform: scale(.94, 1.06); } }
  [data-tema="allegra"] .strato { display: block; }
  [data-tema="allegra"] .s1 { inset: 16%; background: linear-gradient(135deg, #ffd36e, #ff7eb3 35%, #a78bfa 65%, #7ef0ff); filter: blur(2px);
    animation: forma 6s ease-in-out infinite, colori 10s linear infinite; }
  @keyframes colori { 50% { filter: blur(2px) hue-rotate(35deg) saturate(1.2); } }
  [data-tema="allegra"] .s2 { inset: 16%; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.7), transparent 40%); border-radius: 50%; }
  [data-tema="allegra"] .s3 { display: none; }
  [data-tema="allegra"] .faccia { display: block; position: absolute; inset: 16%; pointer-events: none; animation: guarda 9s ease-in-out infinite; }
  @keyframes guarda { 0%,35%,100% { transform: translate(0,0); } 45%,60% { transform: translate(-10px,2px); } 70%,88% { transform: translate(10px,-2px); } }
  [data-tema="allegra"] .occhio { position: absolute; top: 36%; width: 24px; height: 34px; border-radius: 50%; background: #241446; animation: batti 4.6s infinite; transition: transform .3s; }
  [data-tema="allegra"] .occhio::after { content: ""; position: absolute; top: 6px; left: 5px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  [data-tema="allegra"] .occhio.sx { left: 31%; }
  [data-tema="allegra"] .occhio.dx { right: 31%; animation-delay: .04s; }
  @keyframes batti { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  [data-tema="allegra"] .bocca { position: absolute; top: 62%; left: 50%; width: 40px; height: 16px; margin-left: -20px; border: 5px solid #241446; border-top: 0; border-radius: 0 0 40px 40px; transition: all .3s; }
  /* Ascolta: occhi grandi, bocca a "o", onde che escono dal cerchio */
  [data-tema="allegra"] body.ascolto #cerchio { animation: saltello .9s ease-in-out infinite; box-shadow: 0 0 90px rgba(126,240,255,.5), inset 0 1px 0 rgba(255,255,255,.3); }
  @keyframes saltello { 50% { transform: translateY(-14px) scale(1.04); } }
  [data-tema="allegra"] body.ascolto .occhio { transform: scale(1.25); animation: none; }
  [data-tema="allegra"] body.ascolto .bocca { width: 22px; height: 22px; margin-left: -11px; border: 5px solid #241446; border-radius: 50%; }
  [data-tema="allegra"] body.ascolto .faccia { animation: none; }
  [data-tema="allegra"] #cerchio::before, [data-tema="allegra"] #cerchio::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid rgba(126,240,255,.7); opacity: 0; pointer-events: none; }
  [data-tema="allegra"] body.ascolto #cerchio::before { animation: onda 1.6s ease-out infinite; }
  [data-tema="allegra"] body.ascolto #cerchio::after { animation: onda 1.6s ease-out .8s infinite; }
  @keyframes onda { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
  /* Pensa: guarda in alto e dondola */
  [data-tema="allegra"] body.pensa .faccia { animation: dondola 1.2s ease-in-out infinite; }
  @keyframes dondola { 0%,100% { transform: translate(-6px,-10px) rotate(-6deg); } 50% { transform: translate(6px,-10px) rotate(6deg); } }
  [data-tema="allegra"] body.pensa .bocca { width: 18px; height: 0; margin-left: -9px; border-bottom-width: 5px; border-radius: 4px; }
  [data-tema="allegra"] body.pensa .s1 { animation-duration: 1.6s, 2s; }
  /* Parla: la bocca si apre e si chiude */
  [data-tema="allegra"] body.parla #cerchio { animation: parlotta .45s ease-in-out infinite; box-shadow: 0 0 90px rgba(255,126,179,.45); }
  @keyframes parlotta { 50% { transform: scale(1.03, .97); } }
  [data-tema="allegra"] body.parla .bocca { border: 0; background: #241446; width: 34px; margin-left: -17px; height: 8px; border-radius: 0 0 20px 20px; transition: height .07s, border-radius .07s; }
  /* la bocca segue le parole: 0 chiusa, 1 a metà, 2 aperta (data-bocca sul body, messo da diciParola) */
  [data-tema="allegra"] body.parla[data-bocca="1"] .bocca { height: 16px; border-radius: 40% 40% 50% 50%; }
  [data-tema="allegra"] body.parla[data-bocca="2"] .bocca { height: 26px; border-radius: 40% 40% 50% 50%; }
  [data-tema="allegra"] body.errore .s1 { background: linear-gradient(135deg, #ffb4a8, #f87171); }
  [data-tema="allegra"] body.errore .bocca { border-bottom: 0; border-top: 5px solid #241446; border-radius: 40px 40px 0 0; }
  [data-tema="allegra"] #stato { font-weight: 800; background: linear-gradient(90deg, #ffd36e, #ff7eb3, #7ef0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  [data-tema="allegra"] #aiuto, [data-tema="allegra"] #detto { color: #e2d6ff; }
  [data-tema="allegra"] #risposta:not(:empty) { background: rgba(20,8,50,.55); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.2); border-radius: 28px; padding: 18px 28px; }
  [data-tema="allegra"] #avvia { background: rgba(20,11,51,.95); }

  /* ---------- RoboGiuliano: 4 pose, la bocca si muove quando parla ---------- */
  .robo, .orbita, .onde { display: none; }
  [data-tema="robo"] body { background: radial-gradient(ellipse at 50% 30%, #123c78 0%, #071433 48%, #02060f 84%); color: #eef6ff; }
  [data-tema="robo"] #bolle { display: block; position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  [data-tema="robo"] #bolle span { position: absolute; bottom: -60px; border-radius: 50%; zoom: .35; --c: #5fd4ff; opacity: .6;
    background: radial-gradient(circle, #fff, var(--c) 40%, transparent 70%); animation: sale var(--t) linear infinite; animation-delay: var(--d); }
  [data-tema="robo"] .icona, [data-tema="robo"] .strato, [data-tema="robo"] .faccia { display: none; }
  [data-tema="robo"] #cerchio { width: 570px; height: 380px; border-radius: 0; background: transparent; isolation: isolate; }
  /* cerchio di luce dietro la testa */
  [data-tema="robo"] #cerchio::before, [data-tema="robo"] #cerchio::after { content: ""; position: absolute; left: 50%; top: 46%; width: 350px; height: 350px;
    margin: -175px 0 0 -175px; border-radius: 50%; z-index: -1; transition: filter .4s, opacity .4s; }
  [data-tema="robo"] #cerchio::before { background: radial-gradient(circle, rgba(95,212,255,.35), rgba(60,90,220,.15) 55%, transparent 70%),
    conic-gradient(from 0deg, transparent 0 20%, rgba(127,227,255,.9) 25%, transparent 32% 70%, rgba(201,182,255,.9) 75%, transparent 82%);
    -webkit-mask: radial-gradient(circle, #000 64%, transparent 65%, transparent 68%, #000 69%, #000 70%, transparent 71%); mask: radial-gradient(circle, #000 64%, transparent 65%, transparent 68%, #000 69%, #000 70%, transparent 71%);
    animation: ruota 8s linear infinite; }
  [data-tema="robo"] #cerchio::after { background: radial-gradient(circle, rgba(95,170,255,.55), transparent 65%); filter: blur(30px); z-index: -2; }
  [data-tema="robo"] .robo { display: block; position: absolute; inset: 0; animation: galleggia-lento 4.5s ease-in-out infinite; }
  @keyframes galleggia-lento { 50% { transform: translateY(-8px); } }
  [data-tema="robo"] .robo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transform: scale(.96);
    transition: opacity .35s ease, transform .5s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
  [data-tema="robo"] body:not(.ascolto):not(.pensa):not(.parla) .robo img[data-p="riposo"],
  [data-tema="robo"] body.ascolto .robo img[data-p="ascolto"],
  [data-tema="robo"] body.pensa .robo img[data-p="pensa"],
  [data-tema="robo"] body.parla .robo img[data-p="parla"] { opacity: 1; transform: scale(1); }
  /* mentre parla: bocca aperta → a metà → chiusa → a metà */
  [data-tema="robo"] .robo img.p2, [data-tema="robo"] .robo img.p3 { transition: none; transform: none; }
  /* la bocca segue le parole: 0 chiusa (p3), 1 a metà (p2), 2 aperta (la posa "parla") */
  [data-tema="robo"] body.parla[data-bocca="0"] .robo img.p3,
  [data-tema="robo"] body.parla[data-bocca="1"] .robo img.p2 { opacity: 1; }
  /* lucine che girano e onde */
  [data-tema="robo"] .orbita { display: block; position: absolute; left: 50%; top: 46%; width: 390px; height: 390px; margin: -195px 0 0 -195px;
    border-radius: 50%; animation: ruota 6s linear infinite; pointer-events: none; z-index: -1; }
  [data-tema="robo"] .orbita i { position: absolute; width: 10px; height: 10px; border-radius: 50%; top: -5px; left: calc(50% - 5px);
    background: #d9f7ff; box-shadow: 0 0 10px #5fd4ff, 0 0 22px #5fd4ff; }
  [data-tema="robo"] .orbita i + i { top: auto; bottom: -5px; background: #ece2ff; box-shadow: 0 0 10px #a98bff, 0 0 22px #8b5cff; }
  [data-tema="robo"] .onde { display: block; position: absolute; left: 50%; top: 46%; width: 350px; height: 350px; margin: -175px 0 0 -175px; pointer-events: none; z-index: -1; }
  [data-tema="robo"] .onde::before, [data-tema="robo"] .onde::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(95,212,255,.75); opacity: 0; }
  [data-tema="robo"] body.ascolto .onde::before { animation: onda 1.6s ease-out infinite; }
  [data-tema="robo"] body.ascolto .onde::after { animation: onda 1.6s ease-out .8s infinite; }
  [data-tema="robo"] body.parla .onde::before { animation: onda 1s ease-out infinite; }
  [data-tema="robo"] body.parla .onde::after { animation: onda 1s ease-out .5s infinite; }
  [data-tema="robo"] body.ascolto #cerchio::before { animation-duration: 3s; filter: brightness(1.3); }
  [data-tema="robo"] body.ascolto #cerchio::after { opacity: 1; filter: blur(30px) brightness(1.4); }
  [data-tema="robo"] body.ascolto .orbita { animation-duration: 2.6s; }
  [data-tema="robo"] body.pensa #cerchio::before { filter: hue-rotate(45deg); animation-duration: 1.4s; }
  [data-tema="robo"] body.pensa .orbita { animation-duration: .9s; border: 2px dashed rgba(201,182,255,.4); }
  [data-tema="robo"] body.errore #cerchio::after { background: radial-gradient(circle, rgba(255,80,100,.6), transparent 65%); }
  [data-tema="robo"] #stato { font-weight: 800; background: linear-gradient(90deg, #7fe3ff, #ffffff 50%, #c9b6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  [data-tema="robo"] #aiuto, [data-tema="robo"] #detto { color: #a9bfe6; }
  [data-tema="robo"] #risposta:not(:empty) { background: rgba(0,0,0,.42); backdrop-filter: blur(18px); border: 1px solid rgba(127,227,255,.25); border-radius: 24px; padding: 18px 28px; }
  [data-tema="robo"] #avvia { background: rgba(2,6,15,.95); }
  /* RoboYaymaris: stesso stile dei robot, nei toni rosa e viola */
  [data-personaggio="yaymaris"] body { background: radial-gradient(ellipse at 50% 30%, #5a1f6e 0%, #2a0d3f 48%, #10040f 84%); }
  [data-personaggio="yaymaris"] #cerchio::before { background: radial-gradient(circle, rgba(255,126,200,.35), rgba(160,80,220,.15) 55%, transparent 70%),
    conic-gradient(from 0deg, transparent 0 20%, rgba(255,140,210,.9) 25%, transparent 32% 70%, rgba(190,150,255,.9) 75%, transparent 82%); }
  [data-personaggio="yaymaris"] #cerchio::after { background: radial-gradient(circle, rgba(255,110,190,.5), transparent 65%); }
  [data-personaggio="yaymaris"] .orbita i { background: #ffe0f2; box-shadow: 0 0 10px #ff7ec8, 0 0 22px #ff7ec8; }
  [data-personaggio="yaymaris"] .onde::before, [data-personaggio="yaymaris"] .onde::after { border-color: rgba(255,126,200,.75); }
  [data-personaggio="yaymaris"] #bolle span { --c: #ff8fd0; }
  [data-personaggio="yaymaris"] #stato { background: linear-gradient(90deg, #ff9ad5, #ffffff 50%, #c9a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  [data-personaggio="yaymaris"] #aiuto, [data-personaggio="yaymaris"] #detto { color: #e4bfe0; }

  /* ---------- Avatar più vivi (v1.5) ---------- */
  /* La luce dietro il robot si accende a ogni parola */
  [data-tema="robo"] body.parla #cerchio::after { transition: filter .08s, scale .08s, background .5s; }
  [data-tema="robo"] body.parla[data-bocca="2"] #cerchio::after { filter: blur(30px) brightness(1.8); }
  [data-tema="robo"] body.parla[data-bocca="2"] #cerchio::before { scale: 1.03; }
  /* Mentre ascolta, le onde e la luce seguono il volume della sua voce (--vol da 0 a 1) */
  [data-tema="robo"] body.ascolto .onde { scale: calc(1 + var(--vol, 0) * .35); }
  [data-tema="robo"] body.ascolto #cerchio::after { filter: blur(30px) brightness(calc(1 + var(--vol, 0) * 1.4)); scale: calc(1 + var(--vol, 0) * .25); transition: background .5s; }
  [data-tema="allegra"] body.ascolto .s1 { scale: calc(1 + var(--vol, 0) * .1); }
  [data-tema="allegra"] body.ascolto #cerchio::before, [data-tema="allegra"] body.ascolto #cerchio::after { scale: calc(1 + var(--vol, 0) * .45); }
  [data-tema="allegra"] body.ascolto #cerchio { box-shadow: 0 0 calc(60px + var(--vol, 0) * 160px) rgba(126,240,255,.55), inset 0 1px 0 rgba(255,255,255,.3); }
  /* Espressioni secondo quello che dice (data-umore: contenta, triste, sorpresa) */
  [data-tema="allegra"] .faccia::before, [data-tema="allegra"] .faccia::after { content: ""; position: absolute; opacity: 0; transition: opacity .3s; }
  [data-tema="allegra"] body[data-umore="contenta"] .occhio { background: transparent; border: 5px solid #241446; border-bottom: 0; border-radius: 26px 26px 0 0; height: 15px; top: 40%; animation: none; }
  [data-tema="allegra"] body[data-umore="contenta"] .occhio::after { display: none; }
  [data-tema="allegra"] body[data-umore="contenta"] .faccia::before, [data-tema="allegra"] body[data-umore="contenta"] .faccia::after {
    opacity: 1; top: 55%; width: 24px; height: 13px; border-radius: 50%; background: rgba(255,80,140,.55); filter: blur(2px); }
  [data-tema="allegra"] body[data-umore="contenta"] .faccia::before { left: 16%; }
  [data-tema="allegra"] body[data-umore="contenta"] .faccia::after { right: 16%; }
  [data-tema="allegra"] body[data-umore="triste"] .faccia::before, [data-tema="allegra"] body[data-umore="triste"] .faccia::after,
  [data-tema="allegra"] body[data-umore="sorpresa"] .faccia::before, [data-tema="allegra"] body[data-umore="sorpresa"] .faccia::after {
    opacity: 1; top: 27%; width: 26px; height: 5px; border-radius: 3px; background: #241446; }
  [data-tema="allegra"] body[data-umore="triste"] .faccia::before { left: 28%; transform: rotate(-20deg); }
  [data-tema="allegra"] body[data-umore="triste"] .faccia::after { right: 28%; transform: rotate(20deg); }
  [data-tema="allegra"] body[data-umore="triste"] .occhio { height: 26px; top: 40%; }
  [data-tema="allegra"] body[data-umore="triste"]:not(.parla) .bocca { border-bottom: 0; border-top: 5px solid #241446; border-radius: 40px 40px 0 0; }
  [data-tema="allegra"] body[data-umore="sorpresa"] .faccia::before { left: 29%; top: 22%; transform: rotate(-8deg); }
  [data-tema="allegra"] body[data-umore="sorpresa"] .faccia::after { right: 29%; top: 22%; transform: rotate(8deg); }
  [data-tema="allegra"] body[data-umore="sorpresa"] .occhio { transform: scale(1.3); animation: none; }
  [data-tema="allegra"] body[data-umore="sorpresa"]:not(.parla) .bocca { width: 22px; height: 22px; margin-left: -11px; border: 5px solid #241446; border-radius: 50%; }
  /* Robot: cambia il colore della luce (verde bene, arancione problema, oro novità) */
  [data-tema="robo"] body[data-umore] #cerchio::after { scale: 1.3; }
  [data-tema="robo"] body[data-umore=""] #cerchio::after { scale: 1; }
  [data-tema="robo"] body[data-umore="contenta"] #cerchio::before, [data-tema="robo"] body[data-umore="triste"] #cerchio::before,
  [data-tema="robo"] body[data-umore="sorpresa"] #cerchio::before { opacity: .45; }
  [data-tema="robo"] body[data-umore="contenta"] #cerchio::after { background: radial-gradient(circle, rgba(70,235,140,1), rgba(70,235,140,.6) 45%, transparent 70%); }
  [data-tema="robo"] body[data-umore="triste"] #cerchio::after { background: radial-gradient(circle, rgba(255,140,40,1), rgba(255,140,40,.6) 45%, transparent 70%); }
  [data-tema="robo"] body[data-umore="sorpresa"] #cerchio::after { background: radial-gradient(circle, rgba(255,215,70,1), rgba(255,215,70,.6) 45%, transparent 70%); }
  [data-tema="robo"] body[data-umore="contenta"] .orbita i { background: #c9ffdf; box-shadow: 0 0 10px #46eb8c, 0 0 22px #46eb8c; }
  [data-tema="robo"] body[data-umore="triste"] .orbita i { background: #ffe0c4; box-shadow: 0 0 10px #ff8c28, 0 0 22px #ff8c28; }
  [data-tema="robo"] body[data-umore="sorpresa"] .orbita i { background: #fff3c4; box-shadow: 0 0 10px #ffd746, 0 0 22px #ffd746; }
</style>
</head>
<body>
  <div id="bolle" aria-hidden="true"><span style="left:6%;width:22px;height:22px;--c:#ffd36e;--t:14s;--d:-2s;--x:40px"></span><span style="left:15%;width:12px;height:12px;--c:#7ef0ff;--t:11s;--d:-7s;--x:-30px"></span><span style="left:24%;width:30px;height:30px;--c:#ff7eb3;--t:17s;--d:-4s;--x:50px"></span><span style="left:37%;width:14px;height:14px;--c:#a78bfa;--t:12s;--d:-9s;--x:-40px"></span><span style="left:48%;width:20px;height:20px;--c:#7ef0ff;--t:15s;--d:-1s;--x:30px"></span><span style="left:58%;width:10px;height:10px;--c:#ffd36e;--t:10s;--d:-5s;--x:-20px"></span><span style="left:67%;width:26px;height:26px;--c:#ff7eb3;--t:16s;--d:-11s;--x:45px"></span><span style="left:76%;width:16px;height:16px;--c:#a78bfa;--t:13s;--d:-3s;--x:-35px"></span><span style="left:85%;width:24px;height:24px;--c:#7ef0ff;--t:18s;--d:-8s;--x:30px"></span><span style="left:93%;width:12px;height:12px;--c:#ffd36e;--t:11s;--d:-6s;--x:-25px"></span></div>
  <button id="cerchio" aria-label="Parla con l'assistente"><span class="strato s1"></span><span class="strato s2"></span><span class="strato s3"></span><span class="faccia"><span class="occhio sx"></span><span class="occhio dx"></span><span class="bocca"></span></span><span class="robo"><img data-p="riposo" data-f="riposo" alt=""><img data-p="ascolto" data-f="ascolto" alt=""><img data-p="pensa" data-f="pensa" alt=""><img data-p="parla" data-f="parla" alt=""><img data-p="parla" data-f="parla-2" class="p2" alt=""><img data-p="parla" data-f="parla-3" class="p3" alt=""></span><span class="orbita"><i></i><i></i></span><span class="onde"></span><span class="icona">🎙️</span></button>
  <div id="stato">Un momento…</div>
  <div id="azione"></div>
  <div id="aiuto">Di' <b>“Ehi <span class="nome">Claude</span>”</b> oppure tocca il cerchio</div>
  <div id="detto"></div>
  <div id="risposta"></div>
  <div id="avvia"><span>👆</span>Tocca qui per iniziare</div>
  <a id="impostazioni" href="/impostazioni">impostazioni <span id="ver" translate="no"></span></a>
<script>
  const $ = (id) => document.getElementById(id);
  const parametri = new URLSearchParams(location.search);
  let NOME = "Claude";
  // La parola per chiamarlo: accenti facoltativi; "Claude" viene spesso capito come "cloud", "clod"…
  // "RoboGiuliano" va bene anche detto "robo Giuliano" o "robot Giuliano"; gli accenti non contano.
  function creaSveglia(nome) {
    const accenti = { a: "[aàá]", e: "[eèé]", i: "[iìí]", o: "[oòó]", u: "[uùú]" };
    const parti = nome.trim().split(/[\s-]+|(?<=[a-zà-ú])(?=[A-ZÀ-Ú])/).filter(Boolean).map((p) =>
      p.toLowerCase() === "robo" ? "robot?" : p.toLowerCase() === "yaymaris" ? "(?:y|j|i|gi|g)?h?a[iyj]?[\\s-]*mar[iy]s{0,2}" : p.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/[aeiou]/g, (v) => accenti[v]));
    const varianti = /^claude$/i.test(nome) ? "claude|claud|clod|clode|cloud|klod|klaud|cloude" : parti.join("[\\s-]*");
    return new RegExp("(?<![\\p{L}])(?:ehi|hey|ei|ehy|ciao|ok)?\\s*(?:" + varianti + ")(?![\\p{L}])[,.!?]?\\s*", "iu");
  }
  let SVEGLIA = creaSveglia(NOME);
  function usaNome(nome) {
    NOME = (nome || "Claude").trim() || "Claude";
    SVEGLIA = creaSveglia(NOME);
    document.title = "Ehi " + NOME;
    document.querySelectorAll(".nome").forEach((e) => (e.textContent = NOME));
  }
  const PERSONAGGI = {
    allegra: { nome: "Aurora", voce: "femminile" },
    robo: { nome: "RoboGiuliano", voce: "maschile", file: "robo" },
    yaymaris: { nome: "RoboYaymaris", voce: "femminile", file: "yaymaris" },
  };
  const pronto = fetch("/config").then((r) => r.json()).catch(() => ({})).then((c) => {
    if (c.versione) $("ver").textContent = "· v" + c.versione;
    const tema = PERSONAGGI[parametri.get("tema") || c.tema] ? parametri.get("tema") || c.tema : "allegra";
    const pers = PERSONAGGI[tema];
    // I personaggi robot (RoboGiuliano, RoboYaymaris) hanno lo stesso stile: cambiano le foto e i colori.
    document.documentElement.dataset.tema = pers.file ? "robo" : tema;
    document.documentElement.dataset.personaggio = tema;
    if (pers.file) document.querySelectorAll(".robo img").forEach((i) => (i.src = `/${pers.file}-${i.dataset.f}.webp`));
    usaNome(parametri.get("nome") || c.nomeAssistente || pers.nome);
    tipoVoce = parametri.get("voce") || (c.voce && c.voce !== "auto" ? c.voce : pers.voce);
    scegliVoce();
  });
  const ATTESA_COMANDO = 8000;

  let stato = "riposo";       // riposo | comando | pensa | parla
  let timerComando = null;
  let riconoscimento = null;
  let voce = null;
  let parlaSbloccato = true;

  function mostra(nuovo, scritta) {
    stato = nuovo;
    chiudiBocca();
    document.body.className = { comando: "ascolto", pensa: "pensa", parla: "parla" }[nuovo] || "";
    $("stato").textContent = scritta;
    document.querySelector("#cerchio .icona").textContent = { comando: "👂", pensa: "💭", parla: "🗣️" }[nuovo] || "🎙️";
  }
  const aRiposo = () => mostra("riposo", "Sono qui");

  // ---------- Voce che parla ----------
  let tipoVoce = "femminile";
  const NOMI_VOCE = { maschile: /diego|giuseppe|benigno|calimero|cataldo|gianni|gianfranco|lisandro|rinaldo|cosimo/i,
                      femminile: /elsa|isabella|fabiola|fiamma|imelda|irma|palmira|pierina|cosima/i };
  function scegliVoce() {
    const voci = speechSynthesis.getVoices().filter((v) => v.lang && v.lang.toLowerCase().startsWith("it"));
    const giuste = voci.filter((v) => NOMI_VOCE[tipoVoce].test(v.name));
    voce = giuste.find((v) => /natural|online/i.test(v.name)) || giuste[0] || voci.find((v) => /natural|online/i.test(v.name)) || voci[0] || null;
  }
  speechSynthesis.onvoiceschanged = scegliVoce;
  scegliVoce();

  function pulisci(t) {
    return t.replace(/https?:\/\/\S+/g, "").replace(/[*_#`>•]/g, "").replace(/\[id \d+\]/g, "").replace(/\s+/g, " ").trim();
  }

  // La risposta scritta parola per parola, ognuna con la sua posizione nel testo (per il karaoke).
  let parole = [];
  function scriviRisposta(testo) {
    const box = $("risposta");
    box.textContent = "";
    parole = [];
    for (const m of testo.matchAll(/\S+/g)) {
      const el = document.createElement("span");
      el.className = "p";
      el.textContent = m[0];
      box.append(el, " ");
      parole.push({ el, da: m.index, a: m.index + m[0].length });
    }
  }
  // ---------- Bocca a tempo con le parole: si apre e chiude per ogni sillaba (gruppo di vocali) ----------
  let timerBocca = [];
  const bocca = (livello) => { document.body.dataset.bocca = livello; };
  function chiudiBocca() { timerBocca.forEach(clearTimeout); timerBocca = []; bocca(0); }
  function diciParola(parola) {
    chiudiBocca();
    const sillabe = Math.max(1, Math.min(5, (parola.match(/[aeiouàèéìòù]+/gi) || []).length));
    for (let s = 0; s < sillabe; s++) {
      timerBocca.push(setTimeout(() => bocca(2), s * 130), setTimeout(() => bocca(1), s * 130 + 75));
    }
    timerBocca.push(setTimeout(() => bocca(0), sillabe * 130 + 30));
  }

  // Che faccia fare secondo quello che dice.
  function umoreDi(t) {
    if (/purtroppo|mi dispiace|non (sono riuscit|riesco|funziona)|spent[ao]|errore|problema|scusa/i.test(t)) return "triste";
    if (/(email|mail|messagg\w*|letter\w*) nuov|nuov[ae] (email|mail)|è arrivat|sono arrivat/i.test(t) && !/non ci sono|nessun/i.test(t)) return "sorpresa";
    if (/\b(fatto|ecco|perfetto|ho (stampato|mandato|inviato|salvato|scaricato)|stampat[ao]|inviat[ao]|salvat[ao])\b/i.test(t)) return "contenta";
    return "";
  }
  let timerUmore = null;
  function umore(u) { clearTimeout(timerUmore); document.body.dataset.umore = u; }

  // ---------- Volume della sua voce mentre ascolta (per le onde) ----------
  let volumeAvviato = false;
  async function avviaVolume() {
    if (volumeAvviato || !navigator.mediaDevices) return;
    volumeAvviato = true;
    try {
      const flusso = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const ac = new AudioContext(), a = ac.createAnalyser();
      a.fftSize = 512;
      ac.createMediaStreamSource(flusso).connect(a);
      const dati = new Uint8Array(a.fftSize);
      let liscio = 0, ultimo = -1;
      const giro = () => {
        if (stato === "comando") {
          if (ac.state === "suspended") ac.resume();
          a.getByteTimeDomainData(dati);
          let somma = 0;
          for (const v of dati) somma += (v - 128) ** 2;
          liscio = liscio * 0.7 + Math.min(1, Math.sqrt(somma / dati.length) / 128 * 5) * 0.3;
        } else liscio *= 0.8;
        const v = Math.round(liscio * 100) / 100;
        if (v !== ultimo) { document.body.style.setProperty("--vol", v); ultimo = v; }
        requestAnimationFrame(giro);
      };
      giro();
    } catch {}
  }

  // Accende le parole fino alla posizione "pos"; quella che contiene "pos" è quella che sta dicendo.
  function arrivaA(pos, finita) {
    for (const p of parole) {
      const detta = p.da < pos || (finita && p.da <= pos);
      const ora = !finita && p.da <= pos && pos < p.a + 1;
      p.el.classList.toggle("detta", detta || ora);
      if (ora && !p.el.classList.contains("ora")) { p.el.scrollIntoView({ block: "nearest", behavior: "smooth" }); diciParola(p.el.textContent); }
      p.el.classList.toggle("ora", ora);
    }
  }

  // Le frasi lunghe vengono dette a pezzi: alcune voci si interrompono dopo 15 secondi.
  function parla(testo) {
    return new Promise((finito) => {
      const pulito = pulisci(testo);
      const frasi = [...pulito.matchAll(/[^.!?;:]+[.!?;:]*/g)];
      if (!frasi.length) frasi.push(Object.assign([pulito], { index: 0 }));
      let i = 0, stima = null;
      const fatto = () => { clearInterval(stima); arrivaA(pulito.length, true); chiudiBocca(); finito(); };
      speechSynthesis.cancel();
      const prossima = () => {
        clearInterval(stima);
        if (i >= frasi.length || stato !== "parla") return fatto();
        const f = frasi[i++], testoFrase = f[0].trim();
        const inizio = f.index + f[0].indexOf(testoFrase), fine = inizio + testoFrase.length;
        if (i > 1) arrivaA(inizio - 1, true);
        const u = new SpeechSynthesisUtterance(testoFrase);
        u.lang = "it-IT"; if (voce) u.voice = voce; u.rate = 0.95;
        // Se la voce dice a che parola è arrivata si segue quella, altrimenti si stima (circa 14 lettere al secondo).
        let seguo = false;
        u.onboundary = (e) => { if (e.name === "word" || e.name === undefined) { seguo = true; clearInterval(stima); arrivaA(inizio + e.charIndex); } };
        u.onstart = () => {
          const t0 = Date.now();
          stima = setInterval(() => { if (!seguo) arrivaA(Math.min(fine - 1, inizio + (Date.now() - t0) * 0.014)); }, 120);
        };
        u.onend = prossima;
        u.onerror = (e) => {
          if (e.error === "not-allowed") { parlaSbloccato = false; $("avvia").style.display = "flex"; }
          fatto();
        };
        speechSynthesis.speak(u);
      };
      prossima();
    });
  }

  async function rispondi(testo, poiAscolta) {
    fermaAscolto();
    mostra("parla", "Ti rispondo");
    scriviRisposta(pulisci(testo));
    umore(umoreDi(testo));
    await parla(testo);
    timerUmore = setTimeout(() => umore(""), 2500);
    if (stato !== "parla") return;
    // Se ha fatto una domanda, ascolta subito la risposta senza bisogno di ridire il nome.
    if (poiAscolta || /\?\s*$/.test(testo.trim())) aspettaComando(); else aRiposo();
    avviaAscolto();
  }

  // ---------- Orecchio ----------
  const Riconoscimento = window.SpeechRecognition || window.webkitSpeechRecognition;

  function avviaAscolto() {
    if (!Riconoscimento || riconoscimento) return;
    const r = new Riconoscimento();
    r.lang = "it-IT"; r.continuous = true; r.interimResults = true;
    r.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const frase = ev.results[i][0].transcript.trim();
        if (stato === "comando") $("detto").textContent = "“" + frase + "”";
        if (ev.results[i].isFinal) sentito(frase);
      }
    };
    r.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        mostra("riposo", "Non sento il microfono");
        $("aiuto").textContent = "Serve il permesso del microfono: chiedi aiuto a tuo figlio.";
        document.body.className = "errore";
      }
    };
    // Il browser ogni tanto smette di ascoltare da solo: si riparte subito.
    r.onend = () => { riconoscimento = null; if (stato !== "pensa" && stato !== "parla") setTimeout(avviaAscolto, 300); };
    try { r.start(); riconoscimento = r; } catch {}
  }
  function fermaAscolto() {
    if (riconoscimento) { const r = riconoscimento; riconoscimento = null; r.onend = null; try { r.abort(); } catch {} }
  }

  function aspettaComando() {
    clearTimeout(timerComando);
    mostra("comando", "Ti ascolto…");
    avviaVolume();
    $("detto").textContent = "";
    timerComando = setTimeout(() => { if (stato === "comando") aRiposo(); }, ATTESA_COMANDO);
  }

  function sentito(frase) {
    if (stato === "pensa" || stato === "parla") return;
    if (stato === "comando") {
      const comando = frase.replace(SVEGLIA, "").trim();
      if (comando) invia(comando);
      return;
    }
    const m = frase.match(SVEGLIA);
    if (!m) return;
    const resto = frase.slice(m.index + m[0].length).trim();
    if (resto.split(/\s+/).length >= 2) invia(resto); else aspettaComando();
  }

  async function invia(testo) {
    clearTimeout(timerComando);
    fermaAscolto();
    $("detto").textContent = "“" + testo + "”";
    $("risposta").textContent = "";
    umore("");
    mostra("pensa", "Ci penso…");
    // Intanto chiede al programma cosa sta facendo davvero (posta, stampante, internet…) e lo scrive.
    const guarda = setInterval(async () => {
      try {
        const a = await (await fetch("/attivita")).json();
        if (stato !== "pensa" || !a.testo) return;
        $("stato").textContent = a.testo;
        $("azione").textContent = a.icona + " " + a.dove;
        $("azione").classList.add("si");
      } catch {}
    }, 500);
    let risposta;
    try {
      const r = await fetch("/chiedi", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ testo }) });
      risposta = (await r.json()).risposta || "Scusa, non ho capito.";
    } catch {
      risposta = "Scusa, qualcosa non ha funzionato. Riprova.";
    }
    clearInterval(guarda);
    $("azione").classList.remove("si");
    await rispondi(risposta);
  }

  // ---------- Tocchi ----------
  $("cerchio").onclick = () => {
    if (stato === "parla") { speechSynthesis.cancel(); aRiposo(); avviaAscolto(); return; }
    if (stato === "pensa") return;
    aspettaComando();
    avviaAscolto();
  };
  $("avvia").onclick = () => {
    $("avvia").style.display = "none";
    parlaSbloccato = true;
    rispondi("Eccomi! Quando ti serve qualcosa, di' Ehi " + NOME + ".");
  };

  // Dopo un aggiornamento automatico la pagina si ricarica da sola (quando non sta parlando).
  let versione = null;
  setInterval(async () => {
    try {
      const v = (await (await fetch("/ping")).json()).versione;
      if (versione && v !== versione && stato === "riposo") location.reload();
      versione = v;
    } catch {}
  }, 60 * 1000);

  if (!Riconoscimento) {
    $("stato").textContent = "Questo browser non sente la voce";
    $("aiuto").textContent = "Apri l'assistente con Microsoft Edge.";
  } else {
    pronto.then(() => setTimeout(() => rispondi("Ciao! Sono " + NOME + ". Quando ti serve qualcosa, di' Ehi " + NOME + "."), 600));
  }
</script>
</body>
</html>
